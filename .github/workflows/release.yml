name: Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release
        required: true

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ inputs.tag || github.ref }}

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        run: |
          {
            echo '## Changelog'
            echo
            awk '
              /^## 0\.18\.0-dev$/ { emit = 1; next }
              /^## / && emit { exit }
              emit { print }
            ' CHANGELOG.md
            cat <<'EOF'

          ## How to configure the scrollbar

          Add this to your Alacritty config file:

          ```toml
          [scrollbar]
          mode = "Always"
          ```

          `mode` controls when the scrollbar is shown:

          - `"Never"` disables the scrollbar.
          - `"Fading"` shows the scrollbar after scrolling or new output, then fades it out.
          - `"Always"` keeps the scrollbar visible and reserves space for it.
          EOF
          } > release-notes.md
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --notes-file release-notes.md
